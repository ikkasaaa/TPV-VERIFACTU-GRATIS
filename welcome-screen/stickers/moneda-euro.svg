<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" aria-hidden="true">
  <!-- moneda-euro: euro coin face-on with a little edge thickness. Silhouette = r76 disc (union of both faces);
       the .st-shadow layer reuses it. Die-cut border = Nata fill + 8-unit Nata stroke on the silhouette (4-unit outer rim).
       .part-back-face sits UNDER .part-front-face. To show the reverse mid-flip, hide .part-front-face. -->
  <defs>
    <path id="sil-moneda-euro" d="M100 24 A76 76 0 1 1 100 176 A76 76 0 1 1 100 24 Z"/>
  </defs>
  <use href="#sil-moneda-euro" fill="#FFF6EA" stroke="#FFF6EA" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <g id="moneda-euro-art">
    <!-- reverse: '1' + map dot (hidden under the front face until the page flips it) -->
    <g class="part-back-face">
      <circle cx="100" cy="100" r="76" fill="#FFB067"/>
      <path d="M150.66 43.34 A76 76 0 1 1 43.34 150.66 A76 76 0 0 0 150.66 43.34 Z" fill="#D98A45"/>
      <path d="M168.79 125.04 L170.66 125.72 M163.39 136.6 L165.13 137.6 M156.07 147.05 L157.61 148.34 M147.05 156.07 L148.34 157.61 M136.6 163.39 L137.6 165.13 M125.04 168.79 L125.72 170.66" stroke="#3B2A6B" stroke-opacity=".5" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M146.56 50.44 A68 68 0 1 1 50.44 146.56 A68 68 0 0 0 146.56 50.44 Z" fill="#D98A45"/>
      <circle cx="100" cy="100" r="70" fill="none" stroke="#FFF6EA" stroke-width="4"/>
      <g class="part-one">
        <path d="M88 86 L104 72 V128" fill="none" stroke="#3B2A6B" stroke-opacity=".55" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M88 86 L104 72 V128" fill="none" stroke="#FFF6EA" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="132" cy="110" r="8" fill="#3B2A6B" fill-opacity=".55"/>
        <circle cx="132" cy="110" r="6.5" fill="#FFF6EA"/>
      </g>
      <ellipse cx="69" cy="66" rx="15" ry="8" transform="rotate(-42 69 66)" fill="#FFF6EA" fill-opacity=".72"/>
      <circle cx="100" cy="100" r="74" fill="none" stroke="#FFF6EA" stroke-opacity=".4" stroke-width="1"/>
      <circle cx="100" cy="100" r="75.25" fill="none" stroke="#3B2A6B" stroke-opacity=".6" stroke-width="1.5"/>
    </g>
    <!-- obverse: euro sign -->
    <g class="part-front-face">
      <circle cx="100" cy="100" r="76" fill="#FFB067"/>
      <path d="M150.66 43.34 A76 76 0 1 1 43.34 150.66 A76 76 0 0 0 150.66 43.34 Z" fill="#D98A45"/>
      <path d="M168.79 125.04 L170.66 125.72 M163.39 136.6 L165.13 137.6 M156.07 147.05 L157.61 148.34 M147.05 156.07 L148.34 157.61 M136.6 163.39 L137.6 165.13 M125.04 168.79 L125.72 170.66" stroke="#3B2A6B" stroke-opacity=".5" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M146.56 50.44 A68 68 0 1 1 50.44 146.56 A68 68 0 0 0 146.56 50.44 Z" fill="#D98A45"/>
      <circle cx="100" cy="100" r="70" fill="none" stroke="#FFF6EA" stroke-width="4"/>
      <g class="part-euro">
        <path d="M125.09 75.57 A31 31 0 1 0 125.09 124.43" fill="none" stroke="#3B2A6B" stroke-opacity=".55" stroke-width="18" stroke-linecap="round"/>
        <path d="M63 91.5 H101 M63 108.5 H101" fill="none" stroke="#3B2A6B" stroke-opacity=".55" stroke-width="16" stroke-linecap="round"/>
        <path d="M125.09 75.57 A31 31 0 1 0 125.09 124.43" fill="none" stroke="#FFF6EA" stroke-width="15" stroke-linecap="round"/>
        <path d="M63 91.5 H101 M63 108.5 H101" fill="none" stroke="#FFF6EA" stroke-width="13" stroke-linecap="round"/>
      </g>
      <ellipse cx="69" cy="66" rx="15" ry="8" transform="rotate(-42 69 66)" fill="#FFF6EA" fill-opacity=".72"/>
      <circle cx="100" cy="100" r="74" fill="none" stroke="#FFF6EA" stroke-opacity=".4" stroke-width="1"/>
      <circle cx="100" cy="100" r="75.25" fill="none" stroke="#3B2A6B" stroke-opacity=".6" stroke-width="1.5"/>
    </g>
  </g>
</svg>
